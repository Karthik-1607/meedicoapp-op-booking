services:
  - type: web
    name: meedicoapp-op-booking
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      - key: DATABASE_PATH
        value: meedicoapp.db
      - key: CORS_ORIGINS
        value: "*"
